<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feasibility Study — Scarce</title>
<link rel="stylesheet" href="shared.css">
<style>
  .wrap{max-width:1180px;margin:0 auto;padding:4px 16px 40px}
  #fs *{box-sizing:border-box}
  .toolTitle{font-size:22px;font-weight:800;letter-spacing:.03em;color:var(--navy);margin:16px 0 14px}
  .toolTitle span{color:var(--teal);font-style:italic;font-weight:800}

  .modeTabs{display:flex;gap:6px;margin-bottom:16px;background:var(--mid);padding:5px;border-radius:11px;max-width:520px}
  .modeTab{flex:1;text-align:center;padding:11px 10px;border-radius:8px;font-weight:700;font-size:13px;color:var(--grey);cursor:pointer}
  .modeTab.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(20,24,28,.08)}
  .modePanel{display:none}
  .stratExplainer{background:var(--mid);border-left:4px solid var(--gold);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--ink);line-height:1.55;margin-bottom:14px}
  .modePanel.on{display:block}

  .secCard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
  .secCard .collapsible-head h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-weight:800;margin:0}
  .secCard .collapsible-body{margin-top:14px}
  .fGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:900px){.fGrid{grid-template-columns:1fr 1fr}}
  @media(max-width:520px){.fGrid{grid-template-columns:1fr}}
  .fld label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--grey);font-weight:600;margin-bottom:5px}
  .fld label b{color:var(--navy);font-weight:800}
  .fld input, .fld select{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;background:var(--cream);color:var(--navy);font-weight:600}
  .fld input:focus, .fld select:focus{outline:2px solid var(--teal);outline-offset:1px}
  .runBtn{background:var(--teal);color:#fff;border:none;font:inherit;font-weight:700;font-size:14px;padding:12px 24px;border-radius:9px;cursor:pointer;margin:6px 0 20px}
  .runBtn:hover{background:var(--teal-deep)}
  .runBtn:disabled{background:var(--grey);cursor:not-allowed}

  .headlineRow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  @media(max-width:760px){.headlineRow{grid-template-columns:1fr 1fr}}
  .hCard{background:var(--navy);border-radius:12px;padding:16px;text-align:center}
  .hCard .hLbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#B9BDC2;font-weight:700}
  .hCard .hVal{font-size:24px;font-weight:800;color:#fff;margin-top:4px}
  .hCard.good .hVal{color:#7FD6C9}
  .hCard.bad .hVal{color:#F0A87A}

  .resGrid{display:grid;grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));gap:14px;align-items:start;margin-bottom:14px}
  .sumCard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .sumCard h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:10px}
  .sLine{display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px;border-bottom:1px solid var(--line);color:var(--grey)}
  .sLine:last-child{border-bottom:0}
  .sLine .v{font-weight:700;color:var(--ink)}

  .insightBox{padding:14px 16px;border-radius:10px;font-size:13px;line-height:1.5;border-left:4px solid var(--teal);background:var(--mid);margin-bottom:14px}
  .insightBox.warn{border-left-color:var(--orange);background:#FDF3EA}
  .insightBox b{color:var(--navy)}

  .chartWrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .legend{display:flex;gap:16px;justify-content:center;margin:-4px 0 14px;font-size:11.5px;color:var(--grey)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .chartWrap h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  #cfChartRental{width:100%;height:200px;display:block}
  .granBtnFs{background:transparent;border:1px solid var(--line);color:var(--grey);font:inherit;font-size:10.5px;font-weight:700;
    padding:4px 10px;border-radius:6px;cursor:pointer;margin-left:5px}
  .granBtnFs.on{background:var(--teal);color:#fff;border-color:var(--teal)}

  .tableWrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .tableWrap .tableHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .tableWrap h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:800;margin:0}
  .exportBtns{display:flex;gap:8px}
  .exportBtn{background:var(--mid);border:1px solid var(--line);color:var(--navy);font:inherit;font-size:11.5px;font-weight:700;
    padding:6px 12px;border-radius:7px;cursor:pointer}
  .exportBtn:hover{background:var(--line)}
  .cfTable{width:100%;border-collapse:collapse;font-size:12.5px}
  .cfTable th{background:var(--navy);color:#fff;text-align:right;padding:7px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
  .cfTable th:first-child{text-align:left}
  .cfTable td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);color:var(--ink)}
  .cfTable td:first-child{text-align:left;font-weight:700;color:var(--navy)}
  .cfTable td.neg{color:var(--red)}
  .cfTable tbody tr:hover{background:var(--cream)}

  .rGate{background:var(--navy);border-radius:14px;padding:40px 30px;color:#fff;text-align:center;max-width:520px;margin:60px auto}
  .rGate h3{font-size:19px;font-weight:800;margin-bottom:8px}
  .rGate p{font-size:13.5px;color:#C9CDD2;margin-bottom:16px;line-height:1.5}
  .rGate a{display:inline-block;background:var(--teal);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:11px 22px;border-radius:9px}
  .loading{color:var(--grey);text-align:center;padding:40px}
</style>
</head>

  // Buckets the raw monthly array (already computed by the backend)
  // into whatever granularity is requested. Purely client-side — no
  // extra API call needed, since the full monthly detail is already
  // in the response from calculate-feasibility.
  function bucketFeasibility(monthlyArr, size, labelFn){
    var buckets = [];
    for(var i=0;i<monthlyArr.length;i+=size){
      var slice = monthlyArr.slice(i, i+size);
      if(!slice.length) continue;
      var cf = slice.reduce(function(s,m){ return s+m.cf; }, 0);
      buckets.push({ label: labelFn(slice[0]), cf: cf });
    }
    var cum=0;
    buckets.forEach(function(b){ cum += b.cf; b.cum = cum; });
    return buckets;
  }

  function getBucketedData(result, granularity){
    if(granularity === "annual"){
      return result.yearly.map(function(y){ return { label: "Y"+y.y, cf: y.cf, cum: y.cum }; });
    }
    if(granularity === "quarterly"){
      return bucketFeasibility(result.monthly, 3, function(first){ return "Y"+first.y+"Q"+Math.ceil(first.m/3); });
    }
    // monthly
    return bucketFeasibility(result.monthly, 1, function(first){ return "Y"+first.y+"M"+first.m; });
  }

  function drawCashflowChart(canvas, data){
    var dpr = window.devicePixelRatio || 1;
    var cssW = canvas.clientWidth || canvas.parentElement.clientWidth || 600, cssH = 200;
    canvas.width = cssW*dpr; canvas.height = cssH*dpr;
    var ctx = canvas.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    var padL=8,padR=8,padT=10,padB=20,w=cssW-padL-padR,h=cssH-padT-padB;
    var cfs = data.map(function(d){ return d.cf; });
    var cums = data.map(function(d){ return d.cum; });
    var maxV = Math.max.apply(null, cfs.concat(cums,[0])), minV = Math.min.apply(null, cfs.concat(cums,[0]));
    if(maxV===minV){maxV+=1;minV-=1;}
    var pad=(maxV-minV)*0.15; maxV+=pad; minV-=pad;
    function Y(v){ return padT+(maxV-v)/(maxV-minV)*h; }
    var zeroY=Y(0);
    ctx.strokeStyle="rgba(20,24,28,.15)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,zeroY); ctx.lineTo(padL+w,zeroY); ctx.stroke();
    var n=data.length, bw=Math.max(2,w/n*0.5), gap=w/n;
    for(var i=0;i<n;i++){
      var cx=padL+gap*i+gap/2, v=cfs[i], y0=Y(0), y1=Y(v);
      var top=Math.min(y0,y1), hgt=Math.max(Math.abs(y1-y0),0.5);
      ctx.fillStyle = v>=0 ? "#0E9B96" : "#C0392B";
      ctx.fillRect(cx-bw/2, top, bw, hgt);
    }
    ctx.strokeStyle="#C9952B"; ctx.lineWidth=2; ctx.beginPath();
    for(var j=0;j<n;j++){ var cx2=padL+gap*j+gap/2, y=Y(cums[j]); j?ctx.lineTo(cx2,y):ctx.moveTo(cx2,y); }
    ctx.stroke();
    ctx.fillStyle="#7A7F87"; ctx.font="10px -apple-system,Helvetica,Arial,sans-serif"; ctx.textAlign="center";
    var step = Math.max(1, Math.ceil(n/10));
    for(var k=0;k<n;k+=step){ var cx3=padL+gap*k+gap/2; ctx.fillText(data[k].label, cx3, cssH-6); }
  }

  // ---- Table + export functions (used for the Cash Flow Detail table) ----

  function getTableData(result, granularity){
    if(granularity === "annual"){
      var headers = ["Year","Rent Collected (AED)","NOI (AED)","Debt Service (AED)","Net Cash Flow (AED)","Cumulative (AED)"];
      var rows = result.yearly.map(function(y){
        return ["Y"+y.y, Math.round(y.rent||0), Math.round(y.noi||0), Math.round(y.debt||0), Math.round(y.cf), Math.round(y.cum)];
      });
      return { headers: headers, rows: rows };
    }
    var size = granularity === "quarterly" ? 3 : 1;
    var labelFn = granularity === "quarterly"
      ? function(first){ return "Y"+first.y+" Q"+Math.ceil(first.m/3); }
      : function(first){ return "Y"+first.y+" M"+first.m; };
    var bucketed = bucketFeasibility(result.monthly, size, labelFn);
    var headers = ["Period","Net Cash Flow (AED)","Cumulative (AED)"];
    var rows = bucketed.map(function(b){ return [b.label, Math.round(b.cf), Math.round(b.cum)]; });
    return { headers: headers, rows: rows };
  }

        return "<td class='" + (neg ? "neg" : "") + "'>" + (neg ? "-" : "") + "AED " + Math.abs(cell).toLocaleString("en-AE") + "</td>";
      }).join("") + "</tr>";
    }).join("");
    return "<table class='cfTable'><thead>" + thead + "</thead><tbody>" + tbody + "</tbody></table>";

  function getBucketedDataFlip(result, granularity){
    var size = granularity === "annual" ? 12 : granularity === "quarterly" ? 3 : 1;

      ? function(first){ return "Q"+Math.ceil(first.m/3); }

  // ---- Sell or Hold needs a genuinely different chart — two diverging
  // lines (sell-and-reinvest vs keep-holding) over time, not a single
  // cash-flow bar series like every other tab ----

  function drawComparisonChart(canvas, data){
    var dpr = window.devicePixelRatio || 1;
    var cssW = canvas.clientWidth || canvas.parentElement.clientWidth || 600, cssH = 220;
    canvas.width = cssW*dpr; canvas.height = cssH*dpr;
    var ctx = canvas.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    var padL=45,padR=8,padT=14,padB=24,w=cssW-padL-padR,h=cssH-padT-padB;

    var sellVals = data.map(function(y){ return y.sellValue; });
    var holdVals = data.map(function(y){ return y.holdValue; });
    var all = sellVals.concat(holdVals);
    var maxV = Math.max.apply(null, all), minV = Math.min.apply(null, all.concat([0]));
    if(maxV===minV){maxV+=1;minV-=1;}
    var pad=(maxV-minV)*0.1; maxV+=pad; minV-=Math.max(pad,0);
    function Y(v){ return padT+(maxV-v)/(maxV-minV)*h; }
    var n = data.length, stepX = w/(n-1||1);

    // gridlines + y-axis labels
    ctx.strokeStyle="rgba(20,24,28,.08)"; ctx.fillStyle="#7A7F87"; ctx.font="9px -apple-system,Helvetica,Arial,sans-serif"; ctx.textAlign="right";
    for(var g=0; g<=4; g++){
      var gv = minV + (maxV-minV)*g/4, gy = Y(gv);
      ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(padL+w, gy); ctx.stroke();
      ctx.fillText(Math.round(gv/1000)+"k", padL-6, gy+3);
    }

    function drawLine(vals, color){
      ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.beginPath();
      vals.forEach(function(v,i){ var x=padL+stepX*i, y=Y(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
      ctx.stroke();
      vals.forEach(function(v,i){
        var x=padL+stepX*i, y=Y(v);
        ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
      });
    }
    drawLine(sellVals, "#C9952B");
    drawLine(holdVals, "#0E9B96");

    ctx.fillStyle="#7A7F87"; ctx.textAlign="center";
    var step = Math.max(1, Math.ceil(n/10));
    for(var k=0;k<n;k+=step){ ctx.fillText(data[k].label, padL+stepX*k, cssH-6); }
  }

  // These are point-in-time snapshots (a value AT a given month), not
  // flows to sum — so granularity here means SAMPLING the monthly
  // array at intervals, not adding values together like a cash-flow
  // chart would.
  function getBucketedDataSOH(result, granularity){
    if(granularity === "annual"){
      return result.yearly.map(function(y){ return { label: "Y"+y.y, sellValue: y.sellValue, holdValue: y.holdValue }; });
    }
    var interval = granularity === "quarterly" ? 3 : 1;
    var out = [];
    result.monthly.forEach(function(m, i){
      if(i % interval === 0){
        var label = granularity === "quarterly" ? "Q"+Math.ceil(m.m/3) : "M"+m.m;
        out.push({ label: label, sellValue: m.sellValue, holdValue: m.holdValue });
      }
    });
    return out;
  }

  function getTableDataSOH(result, granularity){
    var bucketed = getBucketedDataSOH(result, granularity || "annual");
    var headers = ["Period","If Sell Now (AED)","If Keep Holding (AED)"];
    var rows = bucketed.map(function(b){ return [b.label, Math.round(b.sellValue), Math.round(b.holdValue)]; });
    return { headers: headers, rows: rows };
  }

  function renderCashflowTableSOH(containerId, result, granularity){
    var t = getTableDataSOH(result, granularity);
    $(containerId).innerHTML = renderTableHTML(t.headers, t.rows);
  }

  // ---- BRRRR-specific bucket/table functions — same plain month/quarter/
  // year label scheme as Flip, since BRRRR also has no true multi-year
  // "yearly" array, just the monthly timeline ----

  function getBucketedDataBRRRR(result, granularity){
    var size = granularity === "annual" ? 12 : granularity === "quarterly" ? 3 : 1;
    var labelFn = granularity === "annual"
      ? function(first){ return "Y"+Math.ceil(first.m/12); }
      : granularity === "quarterly"
      ? function(first){ return "Q"+Math.ceil(first.m/3); }
      : function(first){ return "M"+first.m; };
    return bucketFeasibility(result.monthly, size, labelFn);
  }

  function getTableDataBRRRR(result, granularity){
    var bucketed = getBucketedDataBRRRR(result, granularity);
    var headers = ["Period","Net Cash Flow (AED)","Cumulative (AED)"];
    var rows = bucketed.map(function(b){ return [b.label, Math.round(b.cf), Math.round(b.cum)]; });
    return { headers: headers, rows: rows };
  }

  function renderCashflowTableBRRRR(containerId, result, granularity){
    var t = getTableDataBRRRR(result, granularity);
    $(containerId).innerHTML = renderTableHTML(t.headers, t.rows);
  }

    var brandRows = [];

            drawCashflowChart($("cfChartSTR"), getBucketedDataSTR(lastSTRResult, currentGranSTR));
            renderCashflowTableSTR("cfTableSTR", lastSTRResult, currentGranSTR);
          });
        });

        $("exportExcelBtnSTR").addEventListener("click", function(){
          var t = getTableDataSTR(lastSTRResult, currentGranSTR);
          exportExcel(t.headers, t.rows, "scarce-str-cashflow.xlsx");
        });
        $("exportPdfBtnSTR").addEventListener("click", function(){
          var t = getTableDataSTR(lastSTRResult, currentGranSTR);
          exportPDF(t.headers, t.rows, "Scarce Short-Term Rental — Cash Flow");
        });
      } catch(e){
        $("strResults").innerHTML = '<p style="color:#C0392B">Could not calculate — ' + e.message + '</p>';
      } finally { btn.disabled = false; btn.textContent = "Run Short-Term Rental Analysis"; }
    });

    $("runBRRRR").addEventListener("click", async function(){
      var btn = this; btn.disabled = true; btn.textContent = "Calculating…";
      var body = {
        purchasePrice:+$("b_purchasePrice").value, size:+$("b_size").value,
        renovationCost:+$("b_renovationCost").value, rehabMonths:+$("b_rehabMonths").value,
        initialFund:$("b_initialFund").value, initialLoanPct:+$("b_initialLoanPct").value, initialRatePct:+$("b_initialRatePct").value,
        arv:+$("b_arv").value, refinanceLtvPct:+$("b_refinanceLtvPct").value, refinanceRatePct:+$("b_refinanceRatePct").value,
        refinanceTermYears:+$("b_refinanceTermYears").value, stabilizedMonthlyRent:+$("b_stabilizedMonthlyRent").value,
        scPsf:+$("b_scPsf").value, mgmtPct:+$("b_mgmtPct").value, maintPct:+$("b_maintPct").value, insurePct:+$("b_insurePct").value,
        dldPct:+$("b_dldPct").value, dldAdmin:+$("b_dldAdmin").value, titleDeed:+$("b_titleDeed").value, agentPct:+$("b_agentPct").value,
        trustee:+$("b_trustee").value, conveyance:+$("b_conveyance").value, valuation:+$("b_valuation").value,
        noc:+$("b_noc").value, dewa:+$("b_dewa").value, projectionYears:+$("b_projectionYears").value
      };
      try {
        var headers = await authedHeaders();
        var res = await fetch(FUNCTIONS_URL + "/calculate-brrrr", { method:"POST", headers:headers, body:JSON.stringify(body) });
        var d = await res.json();
        if(d.error){ throw new Error(d.message || d.error); }
        var html = '<div class="headlineRow">'+
            '<div class="hCard '+(d.headline.cashLeftInDeal<=0?"good":"")+'"><div class="hLbl">Cash Left In Deal</div><div class="hVal">'+AED(d.headline.cashLeftInDeal)+'</div></div>'+
            '<div class="hCard"><div class="hLbl">Cash Out At Refi</div><div class="hVal">'+AED(d.headline.cashOutAtRefinance)+'</div></div>'+
            '<div class="hCard"><div class="hLbl">Monthly Cash Flow</div><div class="hVal">'+AED(d.headline.monthlyCashFlow)+'</div></div>'+
            '<div class="hCard"><div class="hLbl">Equity Created</div><div class="hVal">'+AED(d.headline.equityCreated)+'</div></div>'+
          '</div>';
        if(d.headline.infiniteReturn){
          html += '<div class="insightBox"><b>You got all your cash back out, and then some.</b> With '+AED(Math.abs(d.headline.cashLeftInDeal))+' left over after refinancing, your cash-on-cash return on this deal is effectively infinite — nothing of yours remains tied up in it.</div>';
        } else {
          html += '<div class="insightBox"><b>Cash-on-cash return: '+d.headline.cashOnCashReturn.toFixed(1)+'%</b> based on '+AED(d.headline.cashLeftInDeal)+' still left in the deal after refinancing.</div>';
        }
        html += '<div class="resGrid">'+
            '<div class="sumCard"><h3>Buy &amp; Rehab</h3>'+
              '<div class="sLine"><span>Initial cash down</span><span class="v">'+AED(d.buyPhase.initialCashDown)+'</span></div>'+
              '<div class="sLine"><span>Upfront costs</span><span class="v">'+AED(d.buyPhase.upfront)+'</span></div>'+
              '<div class="sLine"><span>Carrying costs (rehab period)</span><span class="v">'+AED(d.buyPhase.carryingCosts)+'</span></div>'+
            '</div>'+
            '<div class="sumCard"><h3>Refinance</h3>'+
              '<div class="sLine"><span>New loan (based on ARV)</span><span class="v">'+AED(d.refinancePhase.newLoanAmount)+'</span></div>'+
              '<div class="sLine"><span>Refinance costs</span><span class="v">'+AED(d.refinancePhase.refinanceCosts)+'</span></div>'+
              '<div class="sLine"><span>Cash out</span><span class="v">'+AED(d.refinancePhase.cashOutAtRefinance)+'</span></div>'+
            '</div>'+
            '<div class="sumCard"><h3>Stabilized</h3>'+
              '<div class="sLine"><span>Monthly rent</span><span class="v">'+AED(d.stabilizedPhase.monthlyRent)+'</span></div>'+
              '<div class="sLine"><span>Monthly opex</span><span class="v">'+AED(d.stabilizedPhase.monthlyOpex)+'</span></div>'+
              '<div class="sLine"><span>New mortgage payment</span><span class="v">'+AED(d.stabilizedPhase.newMonthlyPayment)+'</span></div>'+
            '</div>'+
          '</div>'+
          '<div class="chartWrap"><h3><span>Cash Flow (rehab \u2192 refinance \u2192 stabilized)</span><span><button class="granBtnFs on" data-g="monthly">Monthly</button><button class="granBtnFs" data-g="quarterly">Quarterly</button><button class="granBtnFs" data-g="annual">Annual</button></span></h3><canvas id="cfChartBRRRR"></canvas></div>'+
          '<div class="tableWrap"><div class="tableHead"><h3>Cash Flow Detail</h3><div class="exportBtns">'+
            '<button class="exportBtn" id="exportExcelBtnBRRRR">Export Excel</button>'+
            '<button class="exportBtn" id="exportPdfBtnBRRRR">Export PDF</button>'+
          '</div></div><div id="cfTableBRRRR"></div></div>';

        $("brrrrResults").innerHTML = html;
        lastBRRRRResult = d;
        var currentGranBRRRR = "monthly";
        drawCashflowChart($("cfChartBRRRR"), getBucketedDataBRRRR(d, currentGranBRRRR));
        renderCashflowTableBRRRR("cfTableBRRRR", d, currentGranBRRRR);

        $("brrrrResults").querySelectorAll(".granBtnFs").forEach(function(btn){
          btn.addEventListener("click", function(){
            $("brrrrResults").querySelectorAll(".granBtnFs").forEach(function(b){ b.classList.remove("on"); });
            btn.classList.add("on");
            currentGranBRRRR = btn.dataset.g;
            drawCashflowChart($("cfChartBRRRR"), getBucketedDataBRRRR(lastBRRRRResult, currentGranBRRRR));
            renderCashflowTableBRRRR("cfTableBRRRR", lastBRRRRResult, currentGranBRRRR);
          });
        });

        $("exportExcelBtnBRRRR").addEventListener("click", function(){
          var t = getTableDataBRRRR(lastBRRRRResult, currentGranBRRRR);
          exportExcel(t.headers, t.rows, "scarce-brrrr-cashflow.xlsx");
        });
        $("exportPdfBtnBRRRR").addEventListener("click", function(){
          var t = getTableDataBRRRR(lastBRRRRResult, currentGranBRRRR);
          exportPDF(t.headers, t.rows, "Scarce BRRRR — Cash Flow");
        });
      } catch(e){
        $("brrrrResults").innerHTML = '<p style="color:#C0392B">Could not calculate — ' + e.message + '</p>';
      } finally { btn.disabled = false; btn.textContent = "Run BRRRR Analysis"; }
    });

    $("runSOH").addEventListener("click", async function(){
      var btn = this; btn.disabled = true; btn.textContent = "Calculating…";
      var body = {
        currentValue:+$("o_currentValue").value, remainingLoanBalance:+$("o_remainingLoanBalance").value, size:+$("o_size").value,
        monthlyRent:+$("o_monthlyRent").value, scPsf:+$("o_scPsf").value, mgmtPct:+$("o_mgmtPct").value, maintPct:+$("o_maintPct").value,
        insurePct:+$("o_insurePct").value, monthlyMortgagePayment:+$("o_monthlyMortgagePayment").value, interestRatePct:+$("o_interestRatePct").value,
        holdMoreYears:+$("o_holdMoreYears").value, appPct:+$("o_appPct").value,
        sellAgentPct:+$("o_sellAgentPct").value, earlySettlePct:+$("o_earlySettlePct").value, earlySettleCap:+$("o_earlySettleCap").value,
        alternativeReturnPct:+$("o_alternativeReturnPct").value
      };
      try {
        var headers = await authedHeaders();
        var res = await fetch(FUNCTIONS_URL + "/calculate-sell-or-hold", { method:"POST", headers:headers, body:JSON.stringify(body) });
        var d = await res.json();
        if(d.error){ throw new Error(d.message || d.error); }
        var betterIsHold = d.comparison.betterChoice === "hold";
        var html = '<div class="insightBox '+(betterIsHold?"":"warn")+'"><b>'+(betterIsHold?"Holding":"Selling now")+' comes out ahead</b> by '+AED(Math.abs(d.comparison.difference))+' over '+d.comparison.holdMoreYears+' years, based on the assumptions entered.</div>'+
          '<div class="resGrid">'+
            '<div class="sumCard"><h3>If You Sell Now</h3>'+
              '<div class="sLine"><span>Net proceeds today</span><span class="v">'+AED(d.sellNow.netProceedsNow)+'</span></div>'+
              '<div class="sLine"><span>Future value if reinvested</span><span class="v">'+AED(d.sellNow.futureValueIfReinvested)+'</span></div>'+
            '</div>'+
            '<div class="sumCard"><h3>If You Keep Holding</h3>'+
              '<div class="sLine"><span>Monthly cash flow</span><span class="v">'+AED(d.keepHolding.monthlyCashFlow)+'</span></div>'+
              '<div class="sLine"><span>Cumulative rental cash flow</span><span class="v">'+AED(d.keepHolding.cumulativeRentalCashFlow)+'</span></div>'+
              '<div class="sLine"><span>Property value at end</span><span class="v">'+AED(d.keepHolding.futurePropertyValue)+'</span></div>'+
              '<div class="sLine"><span>Loan balance at end (projected)</span><span class="v">'+AED(d.keepHolding.futureLoanBalance)+'</span></div>'+
              '<div class="sLine"><span>Net sale at end</span><span class="v">'+AED(d.keepHolding.netSaleAtEnd)+'</span></div>'+
              '<div class="sLine"><span><b>Total value if hold</b></span><span class="v"><b>'+AED(d.keepHolding.totalValueIfHold)+'</b></span></div>'+
            '</div>'+
          '</div>'+
          '<div class="chartWrap"><h3><span>Sell vs. Hold — Value Over Time</span><span><button class="granBtnFs" data-g="monthly">Monthly</button><button class="granBtnFs" data-g="quarterly">Quarterly</button><button class="granBtnFs on" data-g="annual">Annual</button></span></h3><canvas id="cfChartSOH"></canvas></div>'+
          '<div class="legend"><span><i style="background:#C9952B"></i>If sell now, reinvested</span><span><i style="background:#0E9B96"></i>If keep holding</span></div>'+
          '<div class="tableWrap"><div class="tableHead"><h3>Period by Period</h3><div class="exportBtns">'+
            '<button class="exportBtn" id="exportExcelBtnSOH">Export Excel</button>'+
            '<button class="exportBtn" id="exportPdfBtnSOH">Export PDF</button>'+
          '</div></div><div id="cfTableSOH"></div></div>';

        $("sohResults").innerHTML = html;
        var currentGranSOH = "annual";
        drawComparisonChart($("cfChartSOH"), getBucketedDataSOH(d, currentGranSOH));
        renderCashflowTableSOH("cfTableSOH", d, currentGranSOH);

        $("sohResults").querySelectorAll(".granBtnFs").forEach(function(btn){
          btn.addEventListener("click", function(){
            $("sohResults").querySelectorAll(".granBtnFs").forEach(function(b){ b.classList.remove("on"); });
            btn.classList.add("on");
            currentGranSOH = btn.dataset.g;
            drawComparisonChart($("cfChartSOH"), getBucketedDataSOH(d, currentGranSOH));
            renderCashflowTableSOH("cfTableSOH", d, currentGranSOH);
          });
        });

        $("exportExcelBtnSOH").addEventListener("click", function(){
          var t = getTableDataSOH(d, currentGranSOH);
          exportExcel(t.headers, t.rows, "scarce-sell-or-hold.xlsx");
        });
        $("exportPdfBtnSOH").addEventListener("click", function(){
          var t = getTableDataSOH(d, currentGranSOH);
          exportPDF(t.headers, t.rows, "Scarce Sell or Hold Comparison");
        });
      } catch(e){
        $("sohResults").innerHTML = '<p style="color:#C0392B">Could not calculate — ' + e.message + '</p>';
      } finally { btn.disabled = false; btn.textContent = "Compare Sell vs Hold"; }
    });

    // Run once on load with defaults so the page isn't empty
    $("runHold").click();
  }

  function renderGate(){
    $("fs").innerHTML = '<div class="rGate"><h3>Feasibility Study is part of Scarce Plus</h3>'+
      '<p>Upgrade to Scarce Plus to run full cash-flow and ROI models — both buy-and-hold and buy-renovate-sell scenarios.</p>'+
      '<a href="auth.html?mode=signup">Get Scarce Plus</a></div>';
  }

  var userBranding = { name: null, logoUrl: null, contactInfo: null };

  async function init(){
    var session = (await sb.auth.getSession()).data.session;
    if(!session){ renderGate(); return; }
    var profRes = await sb.from("profiles").select("tier, name, logo_url, contact_info").eq("id", session.user.id).single();
    if(profRes.data && profRes.data.tier === "paid"){
      userBranding.name = profRes.data.name || null;
      userBranding.logoUrl = profRes.data.logo_url || null;
      userBranding.contactInfo = profRes.data.contact_info || null;
      renderCalculator();
    } else {
      renderGate();
    }
  }

  init();
})();
</script>
</body>
</html>
