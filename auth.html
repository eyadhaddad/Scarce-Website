<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Scarce</title>
<link rel="stylesheet" href="shared.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .wrap{width:100%;max-width:400px}
  .brand{text-align:center;margin-bottom:28px}
  .brand h1{font-size:32px;font-weight:800;letter-spacing:.06em;color:var(--navy)}
  .brand .tag{color:var(--teal);font-weight:700;font-style:italic;font-size:14px;margin-top:4px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:0 20px 40px rgba(20,24,28,.06)}
  .tabs{display:flex;background:var(--mid);border-radius:10px;padding:4px;margin-bottom:24px}
  .tab{flex:1;text-align:center;padding:9px;border-radius:7px;font-weight:700;font-size:13.5px;color:var(--grey);cursor:pointer;transition:all .15s}
  .tab.on{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(20,24,28,.08)}
  h2{font-size:19px;font-weight:800;color:var(--navy);margin-bottom:6px}
  .sub{color:var(--grey);font-size:13px;margin-bottom:20px}
  .fld{margin-bottom:14px}
  .consentRow{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--grey);margin-bottom:16px;line-height:1.5}
  .consentRow input{margin-top:2px}
  .consentRow a{color:var(--teal-deep);font-weight:600}
  .fld label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px}
  .fld input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;
    background:var(--cream);color:var(--navy)}
  .fld input:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
  .submitBtn{width:100%;background:var(--teal);color:#fff;border:none;font:inherit;font-weight:700;font-size:14.5px;
    padding:12px;border-radius:9px;cursor:pointer;margin-top:6px;transition:background .15s}
  .submitBtn:hover{background:var(--teal-deep)}
  .submitBtn:disabled{background:var(--grey);cursor:not-allowed}
  .msg{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:8px;display:none}
  .msg.err{background:#FCF0EE;color:var(--red);display:block}
  .msg.ok{background:#EAF6F5;color:var(--teal-deep);display:block}
  .foot{text-align:center;color:var(--grey);font-size:11.5px;margin-top:22px;line-height:1.5}
  .foot a{color:var(--teal-deep);font-weight:600;text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <h1 aria-label="SCARCE">SC<svg viewBox="0 0 20 24" width="25" height="30" style="vertical-align:-5px;margin:0 1px" aria-hidden="true"><path d="M10 2 L2 22 M10 2 L18 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="10" cy="15" r="2.8" fill="#C9952B"/></svg>RCE</h1>
      <div class="tag">UAE property, decoded.</div>
    </div>

    <div class="card">
      <div class="tabs">
        <div class="tab on" id="tabSignin">Sign in</div>
        <div class="tab" id="tabSignup">Create account</div>
      </div>

      <div id="signinPanel">
        <h2>Welcome back</h2>
        <div class="sub">Sign in to your account</div>
        <div class="fld"><label>Email</label><input type="email" id="siEmail" autocomplete="email"></div>
        <div class="fld"><label>Password</label><input type="password" id="siPassword" autocomplete="current-password"></div>
        <button class="submitBtn" id="siSubmit">Sign in</button>
        <div class="msg" id="siMsg"></div>
      </div>

      <div id="signupPanel" style="display:none">
        <h2>Create your account</h2>
        <div class="sub">Free to start — mortgage calculator and community ratings included</div>
        <div class="fld"><label>Name</label><input type="text" id="suName" autocomplete="name"></div>
        <div class="fld"><label>Email</label><input type="email" id="suEmail" autocomplete="email"></div>
        <div class="fld"><label>Password</label><input type="password" id="suPassword" autocomplete="new-password"></div>
        <div class="consentRow"><input type="checkbox" id="suConsent"> <label for="suConsent">I agree to the <a href="legal.html#terms" target="_blank">Terms of Service</a> and <a href="legal.html#privacy" target="_blank">Privacy Policy</a></label></div>
        <button class="submitBtn" id="suSubmit">Create account</button>
        <div class="msg" id="suMsg"></div>
      </div>
    </div>

    <div class="foot">
      Educational only. Not financial, legal or investment advice.<br>
      © Scarce · scarce.ae
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script>injectSkylineBackground();</script>
<script>
(function(){
  // Publishable key — safe to expose in browser code, RLS does the
  // actual protecting, not secrecy of this key.
  var SUPABASE_URL = "https://qlngrgkzpiyouaewuzhk.supabase.co";
  var SUPABASE_PUBLISHABLE_KEY = "sb_publishable_b7atcH7tnMuuiT9BCqJKmA_bUZw1mZv";
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  window.supabaseClient = sb; // other pages (mortgage calc, portfolio tracker, etc.) reuse this global

  // Where to send someone after a successful sign in / sign up, or if
  // they land on this page while already logged in.
  var REDIRECT_TO = "index.html";

  function $(id){ return document.getElementById(id); }

  // If already logged in, skip straight past this page.
  sb.auth.getSession().then(function(res){
    if(res.data.session){ window.location.href = REDIRECT_TO; }
  });

  $("tabSignin").addEventListener("click", function(){
    $("tabSignin").classList.add("on"); $("tabSignup").classList.remove("on");
    $("signinPanel").style.display = "block"; $("signupPanel").style.display = "none";
  });
  $("tabSignup").addEventListener("click", function(){
    $("tabSignup").classList.add("on"); $("tabSignin").classList.remove("on");
    $("signupPanel").style.display = "block"; $("signinPanel").style.display = "none";
  });

  // Arriving from a "Sign up" link (e.g. the home page banner) lands
  // directly on the signup tab instead of making someone click again.
  if(new URLSearchParams(window.location.search).get("mode") === "signup"){
    $("tabSignup").click();
  }

  function showMsg(el, text, ok){
    el.textContent = text;
    el.className = "msg " + (ok ? "ok" : "err");
  }

  $("siSubmit").addEventListener("click", async function(){
    var email = $("siEmail").value.trim();
    var password = $("siPassword").value;
    var msg = $("siMsg");
    if(!email || !password){ showMsg(msg, "Enter your email and password.", false); return; }

    $("siSubmit").disabled = true; $("siSubmit").textContent = "Signing in…";
    var res = await sb.auth.signInWithPassword({ email: email, password: password });
    $("siSubmit").disabled = false; $("siSubmit").textContent = "Sign in";

    if(res.error){
      showMsg(msg, res.error.message, false);
    } else {
      showMsg(msg, "Signed in — redirecting…", true);
      window.location.href = REDIRECT_TO;
    }
  });

  $("suSubmit").addEventListener("click", async function(){
    var name = $("suName").value.trim();
    var email = $("suEmail").value.trim();
    var password = $("suPassword").value;
    var msg = $("suMsg");

    if(!name){ showMsg(msg, "Enter your name.", false); return; }
    if(!email || !password){ showMsg(msg, "Enter your email and password.", false); return; }
    if(password.length < 6){ showMsg(msg, "Password must be at least 6 characters.", false); return; }
    if(!$("suConsent").checked){ showMsg(msg, "Please agree to the Terms of Service and Privacy Policy to continue.", false); return; }

    $("suSubmit").disabled = true; $("suSubmit").textContent = "Creating account…";
    var res = await sb.auth.signUp({ email: email, password: password });
    $("suSubmit").disabled = false; $("suSubmit").textContent = "Create account";

    if(res.error){
      showMsg(msg, res.error.message, false);
      return;
    }

    // The profiles row is auto-created by the on_auth_user_created
    // trigger — we just need to save the name they entered.
    if(res.data.user){
      await sb.from("profiles").update({ name: name }).eq("id", res.data.user.id);
    }

    if(res.data.session){
      showMsg(msg, "Account created — redirecting…", true);
      window.location.href = REDIRECT_TO;
    } else {
      // Email confirmation is required (depends on your Supabase auth settings)
      showMsg(msg, "Account created — check your email to confirm before signing in.", true);
    }
  });

  // Allow Enter key to submit either form
  $("siPassword").addEventListener("keydown", function(e){ if(e.key === "Enter") $("siSubmit").click(); });
  $("suPassword").addEventListener("keydown", function(e){ if(e.key === "Enter") $("suSubmit").click(); });
})();
</script>
</body>
</html>
