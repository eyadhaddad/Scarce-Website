<style>
  .wrap{max-width:900px;margin:0 auto;padding:4px 16px 40px}
  #cg *{box-sizing:border-box}
  .toolTitle{font-size:22px;font-weight:800;letter-spacing:.03em;color:var(--navy);margin:16px 0 14px}
  .toolTitle span{color:var(--teal);font-style:italic;font-weight:800}
  .disclaimer{background:#FDF3EA;border-left:4px solid var(--orange);border-radius:8px;padding:12px 16px;font-size:12.5px;color:var(--ink);margin-bottom:16px;line-height:1.5}
  .typeTabs{display:flex;gap:6px;margin-bottom:16px;background:var(--mid);padding:5px;border-radius:11px;max-width:420px}
  .typeTab{flex:1;text-align:center;padding:10px;border-radius:8px;font-weight:700;font-size:13px;color:var(--grey);cursor:pointer}
  .typeTab.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(20,24,28,.08)}
  .secCard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
  .secCard h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:12px}
  .fGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:760px){.fGrid{grid-template-columns:1fr 1fr}}
  .fld label{display:block;font-size:11.5px;color:var(--grey);font-weight:600;margin-bottom:5px}
  .fld input, .fld select{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;background:var(--cream);color:var(--navy);font-weight:600}
  .fld input:focus, .fld select:focus{outline:2px solid var(--teal);outline-offset:1px}
  .renewalRow{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;color:var(--ink)}
  .runBtn{background:var(--teal);color:#fff;border:none;font:inherit;font-weight:700;font-size:14px;padding:12px 24px;border-radius:9px;cursor:pointer;margin:6px 0 20px}
  .runBtn:hover{background:var(--teal-deep)}
  .runBtn:disabled{background:var(--grey);cursor:not-allowed}
  .genErr{color:#C0392B;font-size:12.5px;margin-bottom:12px}
  .genOk{color:#0B7A76;font-size:12.5px;margin-bottom:12px}
  .rGate{background:var(--navy);border-radius:14px;padding:40px 30px;color:#fff;text-align:center;max-width:520px;margin:60px auto}
  .rGate h3{font-size:19px;font-weight:800;margin-bottom:8px}
  .rGate p{font-size:13.5px;color:#C9CDD2;margin-bottom:16px;line-height:1.5}
  .rGate a{display:inline-block;background:var(--teal);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:11px 22px;border-radius:9px}
  .loading{color:var(--grey);text-align:center;padding:40px}
  .scheduleHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:8px}
  .scheduleHint{font-size:11.5px;color:var(--grey);font-style:italic;margin-bottom:10px}
  .addClauseBtn{background:none;border:1px solid var(--teal);color:var(--teal-deep);font:inherit;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:7px;cursor:pointer}
  .clauseRow{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
  .clauseRow span{font-weight:800;color:var(--gold);font-size:13px;padding-top:8px;min-width:16px}
  .clauseRow textarea{flex:1;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;background:var(--cream);color:var(--navy);resize:vertical;min-height:38px}
  .clauseRow .rmClauseBtn{background:none;border:none;color:#C0392B;cursor:pointer;font-weight:700;font-size:12px;padding-top:8px}
</style>

  var DUBAI_TERMS = {"en": ["The tenant has inspected the premises and agreed to lease the unit on its current condition.", "Tenant undertakes to use the premises for designated purpose, tenant has no rights to transfer or relinquish the tenancy contract either with or without counterpart to any without landlord written approval. Also, tenant is not allowed to sublease the premises or any part thereof to third party in whole or in part unless it is legally permitted.", "The tenant undertakes not to make any amendments, modifications or addendums to the premises subject of the contract without obtaining the landlord written approval. Tenant shall be liable for any damages or failure due to that.", "The tenant shall be responsible for payment of all electricity, water, cooling and gas charges resulting of occupying leased unit unless other condition agreed in written.", "The tenant must pay the rent amount in the manner and dates agreed with the landlord.", "The tenant fully undertakes to comply with all the regulations and instructions related to the management of the property and the use of the premises and of common areas such (parking, swimming pools, gymnasium, etc.).", "Tenancy contract parties declare all mentioned emails addresses and phone numbers are correct, all formal and legal notifications will be sent to those addresses in case of dispute between parties.", "The landlord undertakes to enable the tenant of the full use of the premises including its facilities (swimming pool, gym, parking lot, etc) and do the regular maintenance as intended unless other condition agreed in written, and not to do any act that would detract from the premises benefit.", "By signing this agreement from the first party, the “Landlord” hereby confirms and undertakes that he is the current owner of the property or his legal representative under legal power of attorney duly entitled by the competent authorities.", "Any disagreement or dispute may arise from execution or interpretation of this contract shall be settled by the Rental Dispute Center.", "This contract is subject to all provisions of Law No (26) of 2007 regulating the relation between landlords and tenants in the emirate of Dubai as amended, and as it will be changed or amended from time to time, as long with any related legislations and regulations applied in the emirate of Dubai.", "Any additional condition will not be considered in case it conflicts with law.", "In case of discrepancy occurs between Arabic and non Arabic texts with regards to the interpretation of this agreement or the scope of its application, the Arabic text shall prevail.", "The landlord undertakes to register this tenancy contract on EJARI affiliated to Dubai Land Department and provide with all required documents."], "ar": ["عاين المستأجر الوحدة موضوع الايجار ووافق على إستئجار العقار على حالته الحالية.", "يتعهد المستأجر باستعمال المأجور للغرض المخصص له، ولا يجوز للمستأجر تحويل أو التنازل عن عقد الايجار للغير بمقابل أو دون مقابل دون موافقة المالك خطيا، كما لا يجوز للمستأجر تأجير المأجور أو أي جزء منه من الباطن ما لم يسمح بذلك قانونا.", "يتعهد المستأجر بعدم إجراء أي تعديلات أو إضافات على العقار موضوع العقد دون موافقة المالك الخطية، ويكون المستأجر مسؤولا عن أي أضرار أو نقص أو تلف يلحق بالعقار.", "يكون المستأجر مسؤولا عن سداد كافة فواتير الكهرباء والمياه والتبريد والغاز المترتبة عن اشغاله المأجور ما لم يتم الاتفاق على غير ذلك كتابيا.", "يتعهد المستأجر بسداد مبلغ الايجار المتفق عليه في هذا العقد في التواريخ والطريقة المتفق عليها.", "يلتزم المستأجر التقيد التام بالانظمة والتعليمات المتعلقة باستخدام المأجور والمنافع المشتركة (كمواقف السيارات، أحواض السباحة، النادي الصحي، الخ).", "يقر أطراف التعاقد بصحة العناوين وأرقام الهواتف المذكورة أعلاه، وتكون تلك العناوين هي المعتمدة رسميا للإخطارات والأعلانات القضائية في حال نشوء أي نزاع بين أطراف العقد.", "يتعهد المؤجر بتمكين المستأجر من الانتفاع التام بالعقار للغرض المؤجر لأجله والمرافق الخاصة به (حوض سباحة، نادي صحي، مواقف سيارات... إلخ) كما يكون مسؤولا عن أعمال الصيانة ما لم يتم الاتفاق على غير ذلك، وعدم التعرض له في منفعة العقار.", "يعتبر توقيع المؤجر على هذا العقد إقرار منه بأنه المالك الحالي للعقار أو الوكيل القانوني للمالك بموجب وكالة قانونية موثقة وفق الأصول لدى الجهات المختصة.", "أي خلاف أو نزاع قد ينشأ عن تنفيذ أو تفسير هذا العقد يعود البت فيه لمركز فض المنازعات الإيجارية.", "يخضع هذا العقد لكافة أحكام القانون رقم (26) لسنة 2007 بشأن تنظيم العلاقة بين مؤجري ومستأجري العقارات في إمارة دبي، وتعديلاته وأي تغيير أو تعديل يطرأ عليه من وقت لآخر، كما يخضع للتشريعات واللوائح الأخرى ذات العلاقة النافذة في دبي.", "لا يعتد بأي شرط تم إضافته إلى هذا العقد في حال تعارضه مع القانون.", "في حال حدوث أي تعارض أو اختلاف في التفسير بين النص العربي والنص الأجنبي يعتمد النص العربي.", "يتعهد المؤجر بتسجيل عقد الايجار في نظام إيجاري التابع لدائرة الأراضي والأملاك وتوفير كافة المستندات اللازمة لذلك."]};
  var AD_TERMS = {"en": ["The Tenant declares and acknowledges that he has inspected the Property subject matter of this Contract and he agreed to lease it as it is.", "The Tenant shall pay the rent agreed upon on the maturity dates and according to the approved method.", "The Tenant shall sub-lease the Premises, or any part thereof, only with the prior written approval of the Lessor, provided that he is committed to registering the sub-tenancy contract with the concerned municipality as prescribed by the legislation applicable in the Emirate of Abu Dhabi.", "The Tenant shall pay all electricity, water, gas, cooling service (if there is cooling company in the community) bills and any other utility bills resulting from using the Premises unless otherwise expressly agreed upon.", "The tenant agrees to pay the owner a Security Deposit upon issuing of the tenancy contract. This Security Deposit is refundable upon vacating the unit, subject of the final inspection of the unit, however, fair wear and tears accepted. The tenant undertakes to pay any additional amounts towards necessary repairs found by the owner upon inspection if the value of the work required exceeds the amount held by the owner.", "If the tenant wishes to carry out repairs or improvements to the unit, it shall be at the tenant's own expense and subject to the prior written approval of the owner. Upon vacating the unit, the tenant shall return the unit to its original condition unless the owner approves otherwise.", "The Tenant is required to register the Tenancy Contract with the relevant Municipality (Tawtheeq) and to pay the fees of registration.", "The Tenant undertakes not to carry on or allow to be carried on, any noisy, offensive or hazardous trade or business or activity or do or permit to be done anything which would constitute a nuisance to the Landlord or to any other occupiers (of the nearby units/offices) which would invalidate the policy of insurance of the Premises (and/or the villas compound or building or other nearby units) against fire or other risks or increase the premium of any such policy.", "The Tenant agrees to perform and abide by any such rules or regulations which may from time to time be issued by the Landlord or the developer for the orderly and better management of the premises (and/or villas compound or building or other units) and any such rules or regulations shall be deemed to be an integral part of this lease Agreement.", "Insurance of the contents is the responsibility of the Tenant. Should the tenant wish not to insure the contents of the property, the Landlord is not liable for any loss or damage on account of fire, theft, flood, accident or for any such event during the Tenancy period.", "The Landlord is not responsible for any damage arising from any accident (electrical, fire, swimming pool or any cause) while using the facilities during the time of occupancy.", "Prior to the expiration of the lease term, the Tenant shall provide the Landlord with written notice no less than sixty (60) days in advance, stating their intention either to vacate the premises or to request a renewal of the lease. The Tenant acknowledges that any renewal is subject solely to the Landlord's discretion and is not guaranteed. Failure to provide such notice within the specified timeframe shall result in the automatic renewal of the lease for an additional term under the same terms and conditions, and the Tenant shall be liable for a penalty equivalent to two (2) months' rent.", "In the event the Tenant is in breach of any provision of this Agreement, the Landlord shall have the right to terminate the Agreement with immediate effect and may require the Tenant to vacate the premises within thirty (30) days from the date of notice. In such cases, the Tenant shall forfeit any rent previously paid and shall not be entitled to any refund.", "If the Tenant wishes to terminate this Agreement prior to its expiry due to unavoidable circumstances, the Tenant must provide the Landlord with a minimum of thirty (30) days' written notice. Upon vacating the premises, the Tenant shall be liable for an early termination penalty equivalent to two (2) months' rent. Any remaining balance of prepaid rent, after deducting the applicable penalty and any other lawful charges, shall be refunded to the Tenant. During the notice period, the Tenant agrees to provide the Landlord or the Landlord's authorized Agents with reasonable access to the premises for the purpose of showing the property to prospective tenants, with prior notice and at mutually convenient times.", "The Owner may terminate the Tenancy in case of non-payment of rent or repeated failure to pay rent in a timely manner. In this case, the tenant has to settle his outstanding dues immediately and vacate the premises.", "The Landlord or any assigned representative or potential buyers or evaluation companies shall be allowed to inspect the property and carry out any maintenance or repairs when required, with the Landlord giving the Tenant notice of not less than 48 hours.", "Should any cheque payment be returned by the bank for insufficient funds, a penalty will be charged to the Tenant by the Landlord and alternative means of payment must be provided within seven days of the due date. Failure to supply due payment will be treated as a breach of contract, and the Landlord may serve immediate written notice to the Tenant to vacate the property.", "Major Maintenance is the sole responsibility of the Landlord and at the Landlord's cost, including air-conditioning, structural, electrical, mechanical, and plumbing repairs.", "Minor Maintenance is the sole responsibility of the Tenant and at the Tenant's cost, including walls painting, replacement of light bulbs, doorknobs, keys and locks, plumbing fittings and fixtures, shut-off valves, drainage blockages caused by the Tenant's use, carpentry repairs, pest control inside the property, cleaning inside the property, and any other restoration of damages caused by the Tenant's misuse or vandalism.", "On vacating the premises, the property should be left in a clean and tidy condition as it was before. If any damage is found or there is a need to re-paint and clean the premises, the Landlord is authorized to deduct from the security deposit to cover maintenance and/or repair expenses. The decision of the Landlord is final in this respect.", "At the end of the contract or on vacating the property, the Tenant is responsible for paying and clearing all utilities dues, carrying out the cancellation of the tenancy registration (Tawtheeq), and providing the Landlord with the cancellation documents along with the relevant clearance certificates to obtain a signed moving-out form.", "Prior to the end of the lease period, the Tenant must submit, sixty (60) days in advance, a written notice of their intention to either vacate the premises or renew the contract, noting that renewal is at the discretion of the Landlord.", "Renewal fees, if applicable, will be paid by the Tenant if they wish to renew the tenancy contract.", "The parties hereto declare and acknowledge that the addresses and telephone numbers mentioned herein are correct and that such addresses and numbers shall be the approved addresses for legal notices and process services in the case of any dispute arising between the parties.", "This agreement, once signed by both parties, shall be considered a legally binding document on both parties.", "This Contract shall be governed by all provisions of Law No. (20) of 2006 concerning Tenancy and Organization of Landlord-Tenant Relation in the Emirate of Abu Dhabi and its amendments, and any changes to it from time to time. Such Contract shall also be governed by other relevant local and federal legislations and regulations applicable in the Emirate.", "The parties understand and confirm that the General Terms and Conditions hereof are not severable, and that any agreement between them to amend, delete or redraft any of these conditions, or the waiver by any of the parties of the rights arising in their favor thereunder, shall be considered null and void and shall not produce any legal effects for either of them or a third party, unless any of the General Terms and Conditions expressly stipulates that the parties may agree in contradiction to what is defined therein.", "In case of any conflict or discrepancy occurring between Arabic and English concerning the interpretation of the provisions of this contract or its appendices, the Arabic text shall prevail."], "ar": ["يقر المستأجر بأنه قد عاين العقار موضوع هذا العقد ووافق على استئجاره على حالته الراهنة.", "يتعهد المستأجر بسداد قيمة الإيجار المتفق عليه في هذا العقد وفق التواريخ وطريقة السداد المتفق عليها.", "لا يجوز للمستأجر إعادة تأجير العقار المؤجر أو أي جزء منه من الباطن إلا بعد الحصول على الموافقة الخطية من المؤجر، على أن يلتزم بتسجيل عقد الإيجار من الباطن لدى البلدية المعنية وفقاً لما هو مقرر بموجب التشريعات السارية في إمارة أبوظبي.", "يكون المستأجر مسؤولاً عن سداد كافة فواتير الكهرباء والماء والغاز وخدمة التبريد (في حالة وجود شركة تبريد في المجمع) وفواتير الاستهلاك المترتبة على استخدام العقار المؤجر، ما لم يتم الاتفاق على غير ذلك صراحة في هذا العقد.", "يلتزم المستأجر بدفع مبلغ تأميني لدى المؤجر وذلك مقابل أية اضرار تنتج عن سوء استخدام الوحدة المؤجرة، ويحق للمؤجر مطالبة المستأجر بأي مبالغ اضافية لإجراء التصليحات والصيانة اللازمة للاضرار الناتجة عن سوء الاستخدام للوحدة المؤجرة.", "اذا رغب المستأجر في اجراء اصلاحات او ادخال اي تحسينات على الوحدة، تكون تلك الاصلاحات او التحسينات على نفقة المستأجر شريطة حصوله على موافقة خطية مسبقة بذلك من المالك، وعند اخلائه الوحدة يجب على المستأجر اعادة الوحدة الى حالتها ووضعيتها الاصلية ما لم يوافق المالك على خلاف ذلك.", "يلتزم المستأجر بالقيام بتسجيل عقد الايجار لدى نظام التوثيق التابع للبلدية المعنية ودفع رسوم التوثيق.", "يتعهد المستأجر بعدم مزاولة او السماح بأية مهنة او اعمال او نشاطات مزعجة او مؤذية او تنطوي على مخاطرة او ان يعمل او يسمح بعمل اي شيء يشكل ازعاجاً او قلقاً للمالك او لأي من سكان (اي وحدة/مكتب اخر قريب من العقار) او ان يعمل او يسمح بعمل اي شيء يبطل او يلغي بوليصة تأمين العقار و/او مجمع الفلل او البناية او اي وحدات سكنية اخرى قريبة ضد الحريق او اية مخاطر اخرى او تزيد قسط التأمين لأي من تلك البوالص.", "يوافق المستأجر على تنفيذ والتقيد بتلك اللوائح او النظم التي يجوز ان يصدرها المالك او المطور من وقت لآخر بقصد حسن تنظيم وادارة العقار (سواء كان مجمع فلل او بناية او اي وحدات اخرى) وتعتبر اي من تلك اللوائح او النظم جزءاً لا يتجزأ من اتفاقية عقد الايجار هذا.", "التأمين على المحتويات تقع على عاتق المستأجر. واذا كان المستأجر لا يرغب في التأمين على محتويات العقار، فان المالك ليس مسؤولاً عن اي خسارة او ضرر بسبب الحريق والسرقة والفيضانات او الحوادث او عن حدث من هذا القبيل خلال فترة الايجار.", "المالك ليس مسؤولاً عن اي ضرر قد ينشأ عن اي حادث (كهربائي، او حريق، او حمام السباحة او اي شيء اخر) من استخدام المرافق خلال فترة العقد.", "قبل انتهاء مدة عقد الإيجار، يلتزم المستأجر بإخطار المالك خطياً قبل مدة لا تقل عن ستين (60) يوماً، مبيناً رغبته إما في إخلاء العقار أو طلب تجديد عقد الإيجار. ويقر المستأجر بأن الموافقة على التجديد تخضع فقط لتقدير المالك ولا تُعد مضمونة بأي حال من الأحوال. في حال عدم تقديم الإشعار خلال الفترة المحددة، يعتبر العقد مجدداً تلقائياً لنفس المدة وبنفس الشروط والأحكام، ويتحمل المستأجر غرامة تعادل قيمة إيجار شهرين.", "في حال إخلال المستأجر بأي بند من بنود هذا العقد، يحق للمالك إنهاء العقد بشكل فوري، ويجوز له مطالبة المستأجر بإخلاء العقار خلال ثلاثين (30) يوماً من تاريخ الإشعار. وفي هذه الحالات، يفقد المستأجر الحق في أي مبلغ إيجار مدفوع مسبقاً ولا يحق له المطالبة بأي استرداد.", "في حال رغب المستأجر في إنهاء هذا العقد قبل تاريخ انتهائه بسبب ظروف قاهرة، يلتزم بتقديم إشعار خطي إلى المالك قبل مدة لا تقل عن ثلاثين (30) يوماً. وعند إخلاء العقار، يكون المستأجر ملزماً بدفع غرامة إنهاء مبكر تعادل قيمة إيجار شهرين. ويتم رد أي رصيد متبقٍ من الإيجار المدفوع مقدماً بعد خصم الغرامة المطبقة وأي رسوم قانونية أخرى إلى المستأجر. وخلال فترة الإشعار، يوافق المستأجر على منح المالك أو من ينوب عنه حق الوصول المعقول إلى العقار لغرض عرضه على المست   async function init(){
    var session = (await sb.auth.getSession()).data.session;
    if(!session){ renderGate(); return; }
    var profRes = await sb.from("profiles").select("tier, name, contact_info").eq("id", session.user.id).single();
    if(!profRes.data || profRes.data.tier !== "paid"){ renderGate(); return; }

    var user = session.user;
    var propRes = await sb.from("properties").select("*").eq("user_id", user.id).order("created_at", { ascending: false });
    userProperties = propRes.data || [];

    var contractRes = await sb.from("generated_contracts").select("*").eq("user_id", user.id).order("created_at", { ascending: false });
    pastContracts = contractRes.data || [];

    renderForm(profRes.data);
  }

  function populateRenewalOptions(){
    var sel = $("renewsContractId");
    var relevant = pastContracts.filter(function(c){ return c.contract_type === currentType; });
    sel.innerHTML = '<option value="">— Select a previous contract —</option>' +
      relevant.map(function(c){
        return "<option value='"+c.id+"'>"+(c.tenant_name||"Unnamed")+" — ends "+c.contract_end+"</option>";
      }).join("");
  }

  function fillFromProperty(propId){
    var p = userProperties.filter(function(x){ return x.id === propId; })[0];
    if(!p) return;
    if(currentType === "rera_dubai"){
      $("buildingName") && ($("buildingName").value = p.building_name || "");
      $("propertyNo") && ($("propertyNo").value = p.property_label || "");
      $("areaSqm") && ($("areaSqm").value = p.size_sqft ? Math.round(p.size_sqft * 0.0929) : "");
      $("location") && ($("location").value = p.community_name || "");
    } else {
      $("community") && ($("community").value = p.community_name || "");
      $("propertyNo") && ($("propertyNo").value = (p.building_name?p.building_name+"-":"") + (p.property_label||""));
    }
  }

  function renderClausesList(){
    var container = $("clausesList");
    container.innerHTML = "";
    clauses.forEach(function(text, idx){
      var row = document.createElement("div");
      row.className = "clauseRow";
      row.innerHTML =
        "<span>"+(idx+1)+".</span>"+
        "<textarea class='clauseText' data-idx='"+idx+"' placeholder='e.g. Tenant may keep one pet, subject to community rules.'>"+esc(text)+"</textarea>"+
        "<button type='button' class='rmClauseBtn' data-idx='"+idx+"'>Remove</button>";
      container.appendChild(row);
    });
    container.querySelectorAll(".clauseText").forEach(function(ta){
      ta.addEventListener("input", function(){ clauses[+ta.dataset.idx] = ta.value; });
    });
    container.querySelectorAll(".rmClauseBtn").forEach(function(btn){
      btn.addEventListener("click", function(){
        clauses.splice(+btn.dataset.idx, 1);
        renderClausesList();
      });
    });
  }

  function wireEvents(){
    $("addClauseBtn").addEventListener("click", function(){
      clauses.push("");
      renderClausesList();
    });

    document.querySelectorAll(".typeTab").forEach(function(tab){
      tab.addEventListener("click", function(){
        document.querySelectorAll(".typeTab").forEach(function(t){ t.classList.remove("on"); });
        tab.classList.add("on");
        currentType = tab.dataset.type;
        renderPropertyFields();
        populateRenewalOptions();
      });
    });

    $("isRenewal").addEventListener("change", function(){
      $("renewalPicker").style.display = this.checked ? "block" : "none";
    });

    $("propertySelect").addEventListener("change", function(){
      if(this.value) fillFromProperty(this.value);
    });

    $("generateBtn").addEventListener("click", generateContract);
  }

  function esc(s){ return (s||"").toString().replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  async function generateContract(){
    var err = $("genErr"), ok = $("genOk");
    err.textContent = ""; ok.textContent = "";

    var landlordName = $("landlordName").value.trim();
    var tenantName = $("tenantName").value.trim();
    var start = $("contractStart").value, end = $("contractEnd").value;
    var rent = +$("annualRent").value;

    if(!landlordName || !tenantName || !start || !end || !rent){
      err.textContent = "Landlord name, tenant name, contract dates, and annual rent are required.";
      return;
    }

    var isRenewal = $("isRenewal").checked;
    var renewsId = $("renewsContractId").value || null;

    var extraFields = {};
    if(currentType === "rera_dubai"){
      extraFields = {
        plotNo: $("plotNo").value, makaniNo: $("makaniNo").value, buildingName: $("buildingName").value,
        propertyNo: $("propertyNo").value, propertyType: $("propertyType").value, areaSqm: $("areaSqm").value,
        premisesNo: $("premisesNo").value, propertyUsage: $("propertyUsage").value, location: $("location").value,
        ownerName: $("ownerName").value, licenseNo: $("licenseNo").value, licensingAuthority: $("licensingAuthority").value,
        landlordEmail: $("landlordEmail").value, tenantEmail: $("tenantEmail").value
      };
    } else {
      extraFields = {
        city: $("city").value, community: $("community").value, propertyNo: $("propertyNo").value,
        bedrooms: $("bedrooms").value, propertyType: $("propertyType").value, parkingCount: $("parkingCount").value
      };
    }

    var cleanClauses = clauses.map(function(c){ return c.trim(); }).filter(function(c){ return c.length > 0; });

    var session = (await sb.auth.getSession()).data.session;
    var record = {
      user_id: session.user.id,
      property_id: $("propertySelect").value || null,
      contract_type: currentType,
      is_renewal: isRenewal,
      renews_contract_id: renewsId,
      landlord_name: landlordName,
      landlord_contact: $("landlordPhone").value.trim() || $("landlordEmail").value.trim() || null,
      landlord_id_number: $("landlordId").value.trim() || null,
      tenant_name: tenantName,
      tenant_contact: $("tenantPhone").value.trim() || $("tenantEmail").value.trim() || null,
      tenant_id_number: $("tenantId").value.trim() || null,
      contract_start: start,
      contract_end: end,
      annual_rent: rent,
      security_deposit: +$("securityDeposit").value || null,
      payment_terms: $("paymentMethod").value + " — " + $("numberOfPayments").value + " payment(s)",
      additional_terms: cleanClauses.length ? JSON.stringify(cleanClauses) : null,
      extra_fields: extraFields
    };

    var res = await sb.from("generated_contracts").insert(record).select().single();
    if(res.error){ err.textContent = "Could not save contract record — try again."; console.error(res.error); return; }

    ok.textContent = "Contract saved. Opening printable document…";
    printContract(record);
  }

  function additionalClausesHtml(r){
    if(!r.additional_terms) return "";
    var list;
    try { list = JSON.parse(r.additional_terms); } catch(e) { return ""; }
    if(!list || !list.length) return "";
    return "<table class='section-title'><tr><td>Additional Terms</td><td class='ar'>شروط إضافية</td></tr></table>"+
      list.map(function(c, i){ return "<div class='clause'>"+(i+1)+". "+esc(c)+"</div>"; }).join("");
  }

  function printContract(r){
    var isDubai = r.contract_type === "rera_dubai";
    var terms = isDubai ? DUBAI_TERMS : AD_TERMS;
    var title = isDubai ? "Unified Tenancy Contract" : "Tenancy Contract";
    var titleAr = isDubai ? "عقد الإيجار الموحد" : "عقد إيجار";

    var win = window.open("", "_blank");
    if(!win){ alert("Please allow pop-ups to view/print the contract."); return; }

    function row(en, ar, val){
      return "<tr><td class='lbl'>"+en+"</td><td>"+esc(val||"—")+"</td><td class='lbl ar'>"+ar+"</td></tr>";
    }
    function sectionHeader(en, ar){
      return "<table class='section-title'><tr><td>"+en+"</td><td class='ar'>"+ar+"</td></tr></table>";
    }

    var bodyHtml;

    if(isDubai){
      var ef = r.extra_fields || {};
      bodyHtml =
        sectionHeader("Date", "التاريخ")+
        "<table>"+ row("Date","التاريخ", new Date().toISOString().slice(0,10)) +"</table>"+

        sectionHeader("Owner / Lessor Information", "معلومات المالك / المؤجر")+
        "<table>"+
          row("Owner's Name","اسم المالك", ef.ownerName || r.landlord_name)+
          row("Lessor's Name","اسم المؤجر", r.landlord_name)+
          row("Lessor's Emirates ID","الهوية الإماراتية للمؤجر", r.landlord_id_number)+
          row("License No. (if a company)","رقم الرخصة في حال كانت شركة", ef.licenseNo)+
          row("Licensing Authority (if a company)","سلطة الترخيص في حال كانت شركة", ef.licensingAuthority)+
          row("Lessor's Email","البريد الإلكتروني للمؤجر", ef.landlordEmail)+
          row("Lessor's Phone","رقم هاتف المؤجر", r.landlord_contact)+
        "</table>"+

        sectionHeader("Tenant Information", "معلومات المستأجر")+
        "<table>"+
          row("Tenant's Name","اسم المستأجر", r.tenant_name)+
          row("Tenant's Emirates ID","الهوية الإماراتية للمستأجر", r.tenant_id_number)+
          row("Tenant's Email","البريد الإلكتروني للمستأجر", ef.tenantEmail)+
          row("Tenant's Phone","رقم هاتف المستأجر", r.tenant_contact)+
        "</table>"+

        sectionHeader("Property Information", "معلومات العقار")+
        "<table>"+
          row("Plot No.","رقم الأرض", ef.plotNo)+
          row("Makani No.","رقم مكاني", ef.makaniNo)+
          row("Location","الموقع", ef.location)+
          row("Building Name","اسم المبنى", ef.buildingName)+
          row("Property Type","نوع الوحدة", ef.propertyType)+
          row("Property No.","رقم العقار", ef.propertyNo)+
          row("Property Area (sqm)","مساحة العقار", ef.areaSqm)+
          row("Premises No. (DEWA)","رقم المبنى (ديوا)", ef.premisesNo)+
          row("Property Usage","استخدام العقار", ef.propertyUsage)+
        "</table>"+

        sectionHeader("Contract Information", "معلومات العقد")+
        "<table>"+
          row("Contract Period — From","فترة العقد - من", r.contract_start)+
          row("Contract Period — To","فترة العقد - إلى", r.contract_end)+
          row("Annual Rent (AED)","الايجار السنوي", r.annual_rent)+
          row("Security Deposit Amount (AED)","مبلغ التأمين", r.security_deposit)+
          row("Mode of Payment","طريقة الدفع", r.payment_terms)+
        "</table>"+

        sectionHeader("General Terms and Conditions", "الأحكام والشروط")+
        terms.en.map(function(clause, i){
          return "<div class='clause'>"+(i+1)+". "+esc(clause)+(terms.ar?"<span class='ar'>"+(i+1)+". "+esc(terms.ar[i])+"</span>":"")+"</div>";
        }).join("")+
        (additionalClausesHtml(r)) +
        "<div class='sig'><div>Tenant Signature — توقيع المستأجر</div><div>Lessor Signature — توقيع المؤجر</div></div>"+

        sectionHeader("Know your Rights", "لمعرفة حقوقكم")+
        "<div class='clause'>You may visit the Rental Dispute Center website through www.dubailand.gov.ae in case of any rental dispute between parties. This contract is subject to Law No. 26 of 2007 regulating the relationship between landlords and tenants, Law No. 33 of 2008 amending Law No. 26 of 2007, and Law No. 43 of 2013 determining rent increases for properties."+
        "<span class='ar'>يمكنكم زيارة موقع مركز فض المنازعات الإيجارية من خلال www.dubailand.gov.ae في حال نشوء أي نزاع إيجاري بين الأطراف. يخضع هذا العقد للقانون رقم 26 لسنة 2007 بشأن تنظيم العلاقة بين المؤجرين والمستأجرين، والقانون رقم 33 لسنة 2008 المعدل له، والقانون رقم 43 لسنة 2013 بشأن تحديد زيادة بدل الإيجار.</span></div>"+

        sectionHeader("Attachments for Ejari Registration", "مرفقات التسجيل في إيجاري")+
        "<div class='clause'>1. Original unified tenancy contract <span class='ar'>1. نسخة أصلية عن عقد الايجار الموحد</span></div>"+
        "<div class='clause'>2. Original Emirates ID of applicant <span class='ar'>2. الهوية الإماراتية الأصلية لمقدم الطلب</span></div>";

    } else {
      var propRows = [["City", "المدينة", r.extra_fields.city], ["Community", "اسم المجمع", r.extra_fields.community],
         ["Property Name/No.", "اسم/رقم العقار", r.extra_fields.propertyNo], ["No of BR", "عدد الغرف", r.extra_fields.bedrooms],
         ["Property Type", "نوع العقار", r.extra_fields.propertyType], ["No. of Parking", "عدد مواقف السيارات", r.extra_fields.parkingCount]];

      bodyHtml =
        sectionHeader("Contract Details", "تفاصيل العقد")+
        "<table>"+
          row("Start Date","تاريخ البداية", r.contract_start)+
          row("End Date","تاريخ النهاية", r.contract_end)+
          row("Annual Rent (AED)","الإيجار السنوي", r.annual_rent)+
          row("Security Deposit (AED)","مبلغ التأمين", r.security_deposit)+
          row("Payment Terms","طريقة السداد", r.payment_terms)+
        "</table>"+
        sectionHeader("Property Details", "تفاصيل العقار")+
        "<table>"+ propRows.map(function(pr){ return row(pr[0], pr[1], pr[2]); }).join("") +"</table>"+
        sectionHeader("Lessor / Landlord Details", "تفاصيل المؤجر")+
        "<table>"+
          row("Full Name","الاسم بالكامل", r.landlord_name)+
          row("ID / License No.","رقم الهوية", r.landlord_id_number)+
        "</table>"+
        sectionHeader("Tenant Details", "تفاصيل المستأجر")+
        "<table>"+
          row("Full Name","الاسم بالكامل", r.tenant_name)+
          row("Emirates ID No.","رقم الهوية الإماراتية", r.tenant_id_number)+
        "</table>"+
        sectionHeader("General Terms and Conditions", "الأحكام والشروط العامة")+
        terms.en.map(function(clause, i){
          return "<div class='clause'>"+(i+1)+". "+esc(clause)+(terms.ar?"<span class='ar'>"+(i+1)+". "+esc(terms.ar[i])+"</span>":"")+"</div>";
        }).join("")+
        (additionalClausesHtml(r)) +
        "<div class='sig'><div>Tenant Signature — توقيع المستأجر</div><div>Lessor Signature — توقيع المؤجر</div></div>";
    }

    var html = "<html><head><meta charset='UTF-8'><title>"+title+"</title><style>"+
      "body{font-family:-apple-system,Helvetica,Arial,sans-serif;padding:30px;color:#14181C;max-width:900px;margin:0 auto}"+
      "h1{font-size:22px;text-align:center;margin-bottom:2px}"+
      "h1 .ar{display:block;font-size:16px;font-weight:400;margin-top:4px;direction:rtl}"+
      ".renewalNote{background:#FDF3EA;border-left:3px solid #D9772F;padding:8px 12px;font-size:12px;margin:12px 0}"+
      "table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12.5px}"+
      "table.section-title td{background:#14181C;color:#fff;font-weight:700;padding:6px 10px}"+
      "table.section-title td.ar{text-align:right;direction:rtl}"+
      "td{border:1px solid #ddd;padding:6px 10px}"+
      "td.lbl{background:#f4f1eb;font-weight:700;width:28%}"+
      "td.lbl.ar{text-align:right;direction:rtl}"+
      ".clause{margin-bottom:10px;font-size:11.5px;line-height:1.5}"+
      ".clause .ar{direction:rtl;text-align:right;color:#333;margin-top:2px;display:block}"+
      ".sig{display:flex;justify-content:space-between;margin-top:40px;font-size:12px}"+
      ".sig div{width:45%;border-top:1px solid #999;padding-top:6px;text-align:center}"+
      ".disc{font-size:10.5px;color:#888;font-style:italic;margin-top:20px;text-align:center}"+
      "@media print{body{padding:10px}}"+
      "</style></head><body>"+
      "<h1>"+title+"<span class='ar'>"+titleAr+"</span></h1>"+
      (r.is_renewal ? "<div class='renewalNote'>This is a <b>renewal</b> of a previous tenancy contract between the same parties.</div>" : "") +
      bodyHtml+
      "<div class='disc'>Educational template only — not legal advice. Verify current requirements with Dubai Land Department / Abu Dhabi Municipality before use.</div>"+
      "</body></html>";

    win.document.write(html);
    win.document.close();
    win.focus();
    setTimeout(function(){ win.print(); }, 400);
  }

  init();
})();
</script>
</body>
</html>
