  .toolTitle span{color:var(--teal);font-style:italic;font-weight:800}

  .modePanel.on{display:block}

  @media(max-width:520px){.fGrid{grid-template-columns:1fr}}

  .fld label b{color:var(--navy);font-weight:800}

  .runBtn:disabled{background:var(--grey);cursor:not-allowed}

  // Buckets the raw monthly array (already computed by the backend)
  // into whatever granularity is requested. Purely client-side — no
  // extra API call needed, since the full monthly detail is already
  // in the response from calculate-feasibility.
  function bucketFeasibility(monthlyArr, size, labelFn){
    var buckets = [];
    for(var i=0;i<monthlyArr.length;i+=size){
      var slice = monthlyArr.slice(i, i+size);
      if(!slice.length) continue;
      var cf = slice.reduce(function(s,m){ return s+m.cf; }, 0);
      buckets.push({ label: labelFn(slice[0]), cf: cf });
    }
    var cum=0;
    buckets.forEach(function(b){ cum += b.cf; b.cum = cum; });
    return buckets;
  }

  function getBucketedData(result, granularity){
    if(granularity === "annual"){
      return result.yearly.map(function(y){ return { label: "Y"+y.y, cf: y.cf, cum: y.cum }; });
    }
    if(granularity === "quarterly"){
      return bucketFeasibility(result.monthly, 3, function(first){ return "Y"+first.y+"Q"+Math.ceil(first.m/3); });
    }
    // monthly
    return bucketFeasibility(result.monthly, 1, function(first){ return "Y"+first.y+"M"+first.m; });
  }

  function drawCashflowChart(canvas, data){
    var dpr = window.devicePixelRatio || 1;
    var cssW = canvas.clientWidth || canvas.parentElement.clientWidth || 600, cssH = 200;
    canvas.width = cssW*dpr; canvas.height = cssH*dpr;
    var ctx = canvas.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    var padL=8,padR=8,padT=10,padB=20,w=cssW-padL-padR,h=cssH-padT-padB;
    var cfs = data.map(function(d){ return d.cf; });
    var cums = data.map(function(d){ return d.cum; });
    var maxV = Math.max.apply(null, cfs.concat(cums,[0])), minV = Math.min.apply(null, cfs.concat(cums,[0]));
    if(maxV===minV){maxV+=1;minV-=1;}
    var pad=(maxV-minV)*0.15; maxV+=pad; minV-=pad;
    function Y(v){ return padT+(maxV-v)/(maxV-minV)*h; }
    var zeroY=Y(0);
    ctx.strokeStyle="rgba(20,24,28,.15)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,zeroY); ctx.lineTo(padL+w,zeroY); ctx.stroke();
    var n=data.length, bw=Math.max(2,w/n*0.5), gap=w/n;
    for(var i=0;i<n;i++){
      var cx=padL+gap*i+gap/2, v=cfs[i], y0=Y(0), y1=Y(v);
      var top=Math.min(y0,y1), hgt=Math.max(Math.abs(y1-y0),0.5);
      ctx.fillStyle = v>=0 ? "#0E9B96" : "#C0392B";
      ctx.fillRect(cx-bw/2, top, bw, hgt);
    }
    ctx.strokeStyle="#C9952B"; ctx.lineWidth=2; ctx.beginPath();
    for(var j=0;j<n;j++){ var cx2=padL+gap*j+gap/2, y=Y(cums[j]); j?ctx.lineTo(cx2,y):ctx.moveTo(cx2,y); }
    ctx.stroke();
    ctx.fillStyle="#7A7F87"; ctx.font="10px -apple-system,Helvetica,Arial,sans-serif"; ctx.textAlign="center";
    var step = Math.max(1, Math.ceil(n/10));
    for(var k=0;k<n;k+=step){ var cx3=padL+gap*k+gap/2; ctx.fillText(data[k].label, cx3, cssH-6); }
  }

  // ---- Table + export functions (used for the Cash Flow Detail table) ----

  function getTableData(result, granularity){
    if(granularity === "annual"){
      var headers = ["Year","Rent Collected (AED)","NOI (AED)","Debt Service (AED)","Net Cash Flow (AED)","Cumulative (AED)"];
      var rows = result.yearly.map(function(y){
        return ["Y"+y.y, Math.round(y.rent||0), Math.round(y.noi||0), Math.round(y.debt||0), Math.round(y.cf), Math.round(y.cum)];
      });
      return { headers: headers, rows: rows };
    }
    var size = granularity === "quarterly" ? 3 : 1;
    var labelFn = granularity === "quarterly"
      ? function(first){ return "Y"+first.y+" Q"+Math.ceil(first.m/3); }
      : function(first){ return "Y"+first.y+" M"+first.m; };
    var bucketed = bucketFeasibility(result.monthly, size, labelFn);
    var headers = ["Period","Net Cash Flow (AED)","Cumulative (AED)"];
    var rows = bucketed.map(function(b){ return [b.label, Math.round(b.cf), Math.round(b.cum)]; });
    return { headers: headers, rows: rows };
  }

  function renderTableHTML(headers, rows){
    var thead = "<tr>" + headers.map(function(h){ return "<th>"+h+"</th>"; }).join("") + "</tr>";
    var tbody = rows.map(function(r){
      return "<tr>" + r.map(function(cell, i){
        if(i === 0) return "<td>" + cell + "</td>";
        var neg = cell < 0;
        return "<td class='" + (neg ? "neg" : "") + "'>" + (neg ? "-" : "") + "AED " + Math.abs(cell).toLocaleString("en-AE") + "</td>";
      }).join("") + "</tr>";
    }).join("");
    return "<table class='cfTable'><thead>" + thead + "</thead><tbody>" + tbody + "</tbody></table>";
  }

  function renderCashflowTable(containerId, result, granularity){
    var t = getTableData(result, granularity);
    $(containerId).innerHTML = renderTableHTML(t.headers, t.rows);
  }

  // ---- Flip-tab equivalents. Flip has no "yearly" array from the
  // backend (a flip is a single short transaction, not a multi-year
  // hold) — everything here buckets from the monthly timeline using
  // plain month counts (M1, M2...) rather than year-relative labels. ----

  function getBucketedDataFlip(result, granularity){
    var size = granularity === "annual" ? 12 : granularity === "quarterly" ? 3 : 1;
    var labelFn = granularity === "annual"
      ? function(first){ return "Y"+Math.ceil(first.m/12); }
      : granularity === "quarterly"
      ? function(first){ return "Q"+Math.ceil(first.m/3); }
      : function(first){ return "M"+first.m; };
    return bucketFeasibility(result.monthly, size, labelFn);
  }

  function getTableDataFlip(result, granularity){
    var bucketed = getBucketedDataFlip(result, granularity);
    var headers = ["Period","Net Cash Flow (AED)","Cumulative (AED)"];
    var rows = bucketed.map(function(b){ return [b.label, Math.round(b.cf), Math.round(b.cum)]; });
    return { headers: headers, rows: rows };
  }

  function renderCashflowTableFlip(containerId, result, granularity){
    var t = getTableDataFlip(result, granularity);
    $(containerId).innerHTML = renderTableHTML(t.headers, t.rows);
  }

  function exportExcel(headers, rows, filename){
    var aoa = [headers].concat(rows);
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Cash Flow");
    XLSX.writeFile(wb, filename);
  }

  function exportPDF(headers, rows, title){
    var win = window.open("", "_blank");
    if(!win){ alert("Please allow pop-ups to export as PDF."); return; }
    var tableHtml = renderTableHTML(headers, rows);
    win.document.write(
      "<html><head><title>" + title + "</title><style>" +
      "body{font-family:-apple-system,Helvetica,Arial,sans-serif;padding:24px;color:#14181C}" +
      "h1{font-size:18px;margin-bottom:16px}" +
      "table{width:100%;border-collapse:collapse;font-size:11px}" +
      "th{background:#14181C;color:#fff;text-align:right;padding:6px 8px}" +
      "th:first-child{text-align:left}" +
      "td{padding:5px 8px;text-align:right;border-bottom:1px solid #ECE9E3}" +
      "td:first-child{text-align:left;font-weight:700}" +
      "</style></head><body><h1>" + title + "</h1>" + tableHtml + "</body></html>"
    );
    win.document.close();
    win.focus();
    setTimeout(function(){ win.print(); }, 300);
  }

  function renderCalculator(){
    var lastHoldResult = null;
    var lastFlipResult = null;
    $("fs").innerHTML = CALC_UI;
    initTabs();
    initCollapsibles();

    $("runHold").addEventListener("click", async function(){
      var btn = this; btn.disabled = true; btn.textContent = "Calculating…";
      var body = {
        price:+$("h_price").value, size:+$("h_size").value, hold:+$("h_hold").value, fund:$("h_fund").value,
        dpPct:+$("h_dpPct").value, rate:+$("h_rate").value, term:+$("h_term").value,
        rentPct:+$("h_rentPct").value, vacancyPct:+$("h_vacancyPct").value, appPct:+$("h_appPct").value, rentGrowthPct:+$("h_rentGrowthPct").value,
        scPsf:+$("h_scPsf").value, mgmtPct:+$("h_mgmtPct").value, maintPct:+$("h_maintPct").value, insurePct:+$("h_insurePct").value,
        dldPct:+$("h_dldPct").value, dldAdmin:+$("h_dldAdmin").value, titleDeed:+$("h_titleDeed").value, agentPct:+$("h_agentPct").value,
        trustee:+$("h_trustee").value, conveyance:+$("h_conveyance").value, valuation:+$("h_valuation").value,
        mortFeePct:+$("h_mortFeePct").value, mortRegPct:+$("h_mortRegPct").value, noc:+$("h_noc").value, dewa:+$("h_dewa").value,
        sellAgentPct:+$("h_sellAgentPct").value, earlySettlePct:+$("h_earlySettlePct").value, earlySettleCap:+$("h_earlySettleCap").value
      };
      try {
        var headers = await authedHeaders();
        var res = await fetch(FUNCTIONS_URL + "/calculate-feasibility", { method:"POST", headers:headers, body:JSON.stringify(body) });
        var d = await res.json();
        if(d.error){ throw new Error(d.message || d.error); }

        var goodProfit = d.headline.netProfit >= 0;
        var html = '<div class="headlineRow">'+
          '<div class="hCard '+(goodProfit?"good":"bad")+'"><div class="hLbl">Net Profit</div><div class="hVal">'+AED(d.headline.netProfit)+'</div></div>'+
          '<div class="hCard"><div class="hLbl">ROI</div><div class="hVal">'+d.headline.roi.toFixed(1)+'%</div></div>'+
          '<div class="hCard"><div class="hLbl">Annualized Return</div><div class="hVal">'+d.headline.annualizedReturn.toFixed(1)+'%</div></div>'+
          '<div class="hCard"><div class="hLbl">Net Yield (Yr 1)</div><div class="hVal">'+d.headline.netYield.toFixed(1)+'%</div></div>'+
        '</div>'+
        '<div class="resGrid">'+
          '<div class="sumCard"><h3>Cash Summary</h3>'+
            '<div class="sLine"><span>Down payment</span><span class="v">'+AED(d.cashSummary.down)+'</span></div>'+
            '<div class="sLine"><span>Upfront costs</span><span class="v">'+AED(d.cashSummary.upfront)+'</span></div>'+
            '<div class="sLine"><span>Total rent collected</span><span class="v">'+AED(d.cashSummary.totRent)+'</span></div>'+
            '<div class="sLine"><span>Total operating costs</span><span class="v">'+AED(d.cashSummary.totOpex)+'</span></div>'+
            '<div class="sLine"><span>Total debt service</span><span class="v">'+AED(d.cashSummary.totDebt)+'</span></div>'+
            '<div class="sLine"><span>Net sale proceeds</span><span class="v">'+AED(d.cashSummary.netSale)+'</span></div>'+
          '</div>'+
          '<div class="sumCard"><h3>Profit Summary</h3>'+
            '<div class="sLine"><span>Rent collected</span><span class="v">'+AED(d.profitSummary.totRent)+'</span></div>'+
            '<div class="sLine"><span>Operating costs</span><span class="v">-'+AED(d.profitSummary.totOpex)+'</span></div>'+
            '<div class="sLine"><span>Upfront costs</span><span class="v">-'+AED(d.profitSummary.upfront)+'</span></div>'+
            '<div class="sLine"><span>Interest paid</span><span class="v">-'+AED(d.profitSummary.totInterest)+'</span></div>'+
            '<div class="sLine"><span>Exit costs</span><span class="v">-'+AED(d.profitSummary.exitCosts)+'</span></div>'+
            '<div class="sLine"><span>Appreciation</span><span class="v">+'+AED(d.profitSummary.appreciation)+'</span></div>'+
          '</div>'+
        '</div>'+
        '<div class="chartWrap"><h3>Cash Flow <span style="float:right"><button class="granBtnFs" data-g="monthly">Monthly</button><button class="granBtnFs" data-g="quarterly">Quarterly</button><button class="granBtnFs on" data-g="annual">Annual</button></span></h3><canvas id="cfChartRental"></canvas></div>'+
        '<div class="tableWrap"><div class="tableHead"><h3>Cash Flow Detail</h3><div class="exportBtns">'+
          '<button class="exportBtn" id="exportExcelBtn">Export Excel</button>'+
          '<button class="exportBtn" id="exportPdfBtn">Export PDF</button>'+
        '</div></div><div id="cfTableHold"></div></div>';

        $("holdResults").innerHTML = html;
        lastHoldResult = d;
        var currentGran = "annual";
        drawCashflowChart($("cfChartRental"), getBucketedData(d, currentGran));
        renderCashflowTable("cfTableHold", d, currentGran);

        $("holdResults").querySelectorAll(".granBtnFs").forEach(function(btn){
          btn.addEventListener("click", function(){
            $("holdResults").querySelectorAll(".granBtnFs").forEach(function(b){ b.classList.remove("on"); });
            btn.classList.add("on");
            currentGran = btn.dataset.g;
            drawCashflowChart($("cfChartRental"), getBucketedData(lastHoldResult, currentGran));
            renderCashflowTable("cfTableHold", lastHoldResult, currentGran);
          });
        });

        $("exportExcelBtn").addEventListener("click", function(){
          var t = getTableData(lastHoldResult, currentGran);
          exportExcel(t.headers, t.rows, "scarce-feasibility-cashflow.xlsx");
        });
        $("exportPdfBtn").addEventListener("click", function(){
          var t = getTableData(lastHoldResult, currentGran);
          exportPDF(t.headers, t.rows, "Scarce Feasibility Study — Cash Flow");
        });
      } catch(e){
        $("holdResults").innerHTML = '<p style="color:#C0392B">Could not calculate — ' + e.message + '</p>';
      } finally {
        btn.disabled = false; btn.textContent = "Run Feasibility Study";
      }
    });

    $("runFlip").addEventListener("click", async function(){
      var btn = this; btn.disabled = true; btn.textContent = "Calculating…";
      var body = {
        price:+$("f_price").value, size:+$("f_size").value, fund:$("f_fund").value,
        dpPct:+$("f_dpPct").value, rate:+$("f_rate").value,
        renovationCost:+$("f_renovationCost").value, constructionMonths:+$("f_constructionMonths").value,
        postRenoValue:+$("f_postRenoValue").value, holdAfterRenoMonths:+$("f_holdAfterRenoMonths").value,
        dldPct:+$("f_dldPct").value, dldAdmin:+$("f_dldAdmin").value, titleDeed:+$("f_titleDeed").value, agentPct:+$("f_agentPct").value,
        trustee:+$("f_trustee").value, conveyance:+$("f_conveyance").value, valuation:+$("f_valuation").value,
        mortFeePct:+$("f_mortFeePct").value, mortRegPct:+$("f_mortRegPct").value, noc:+$("f_noc").value, dewa:+$("f_dewa").value,
        scPsf:+$("f_scPsf").value, insurePct:+$("f_insurePct").value, sellAgentPct:+$("f_sellAgentPct").value
      };
      try {
        var headers = await authedHeaders();
        var res = await fetch(FUNCTIONS_URL + "/calculate-flip-feasibility", { method:"POST", headers:headers, body:JSON.stringify(body) });
        var d = await res.json();
        if(d.error){ throw new Error(d.message || d.error); }

        var goodProfit = d.headline.netProfit >= 0;
        var html = '<div class="headlineRow">'+
          '<div class="hCard '+(goodProfit?"good":"bad")+'"><div class="hLbl">Net Profit</div><div class="hVal">'+AED(d.headline.netProfit)+'</div></div>'+
          '<div class="hCard"><div class="hLbl">ROI</div><div class="hVal">'+d.headline.roi.toFixed(1)+'%</div></div>'+
          '<div class="hCard"><div class="hLbl">Annualized ROI</div><div class="hVal">'+d.headline.annualizedRoi.toFixed(1)+'%</div></div>'+
          '<div class="hCard"><div class="hLbl">Total Hold</div><div class="hVal">'+d.headline.totalHoldMonths+' mo</div></div>'+
        '</div>';

        if(d.insights.renovationMayNotPayOff){
          html += '<div class="insightBox warn"><b>The renovation may not pay for itself.</b> The value uplift (' + AED(d.insights.upliftValue) + ') is less than the renovation cost — this deal only works if the post-renovation value estimate holds up under real appraisal.</div>';
        } else if(d.insights.upliftVsRenoCostRatio !== null) {
          html += '<div class="insightBox"><b>Value uplift is ' + d.insights.upliftVsRenoCostRatio.toFixed(2) + '× the renovation cost.</b> Every AED spent on renovation is adding ' + d.insights.upliftVsRenoCostRatio.toFixed(2) + ' AED of value, before financing and exit costs.</div>';
        }

        html += '<div class="resGrid">'+
          '<div class="sumCard"><h3>Cash Summary</h3>'+
            '<div class="sLine"><span>Down payment</span><span class="v">'+AED(d.cashSummary.down)+'</span></div>'+
            '<div class="sLine"><span>Upfront costs</span><span class="v">'+AED(d.cashSummary.upfront)+'</span></div>'+
            '<div class="sLine"><span>Renovation cost</span><span class="v">'+AED(d.cashSummary.renovationCost)+'</span></div>'+
            '<div class="sLine"><span>Total carrying costs</span><span class="v">'+AED(d.cashSummary.totalCarryingCosts)+'</span></div>'+
            '<div class="sLine"><span>Net sale proceeds</span><span class="v">'+AED(d.cashSummary.netSaleProceeds)+'</span></div>'+
          '</div>'+
          '<div class="sumCard"><h3>Profit Summary</h3>'+
            '<div class="sLine"><span>Post-renovation value</span><span class="v">'+AED(d.profitSummary.postRenoValue)+'</span></div>'+
            '<div class="sLine"><span>Purchase price</span><span class="v">-'+AED(d.profitSummary.purchasePrice)+'</span></div>'+
            '<div class="sLine"><span>Renovation cost</span><span class="v">-'+AED(d.profitSummary.renovationCost)+'</span></div>'+
            '<div class="sLine"><span>Upfront costs</span><span class="v">-'+AED(d.profitSummary.upfront)+'</span></div>'+
            '<div class="sLine"><span>Interest + charges</span><span class="v">-'+AED(d.profitSummary.totalInterest + d.profitSummary.totalServiceCharge + d.profitSummary.totalInsurance)+'</span></div>'+
            '<div class="sLine"><span>Exit costs</span><span class="v">-'+AED(d.profitSummary.exitCosts)+'</span></div>'+
          '</div>'+
        '</div>'+
        '<div class="chartWrap"><h3>Cash Flow <span style="float:right"><button class="granBtnFs" data-g="monthly">Monthly</button><button class="granBtnFs" data-g="quarterly">Quarterly</button><button class="granBtnFs on" data-g="annual">Annual</button></span></h3><canvas id="cfChartFlip"></canvas></div>'+
        '<div class="tableWrap"><div class="tableHead"><h3>Cash Flow Detail</h3><div class="exportBtns">'+
          '<button class="exportBtn" id="exportExcelBtnFlip">Export Excel</button>'+
          '<button class="exportBtn" id="exportPdfBtnFlip">Export PDF</button>'+
        '</div></div><div id="cfTableFlip"></div></div>';

        $("flipResults").innerHTML = html;
        lastFlipResult = d;
        var currentGranFlip = "annual";
        drawCashflowChart($("cfChartFlip"), getBucketedDataFlip(d, currentGranFlip));
        renderCashflowTableFlip("cfTableFlip", d, currentGranFlip);

        $("flipResults").querySelectorAll(".granBtnFs").forEach(function(btn){
          btn.addEventListener("click", function(){
            $("flipResults").querySelectorAll(".granBtnFs").forEach(function(b){ b.classList.remove("on"); });
            btn.classList.add("on");
            currentGranFlip = btn.dataset.g;
            drawCashflowChart($("cfChartFlip"), getBucketedDataFlip(lastFlipResult, currentGranFlip));
            renderCashflowTableFlip("cfTableFlip", lastFlipResult, currentGranFlip);
          });
        });

        $("exportExcelBtnFlip").addEventListener("click", function(){
          var t = getTableDataFlip(lastFlipResult, currentGranFlip);
          exportExcel(t.headers, t.rows, "scarce-flip-feasibility-cashflow.xlsx");
        });
        $("exportPdfBtnFlip").addEventListener("click", function(){
          var t = getTableDataFlip(lastFlipResult, currentGranFlip);
          exportPDF(t.headers, t.rows, "Scarce Flip Feasibility Study — Cash Flow");
        });
      } catch(e){
        $("flipResults").innerHTML = '<p style="color:#C0392B">Could not calculate — ' + e.message + '</p>';
      } finally {
        btn.disabled = false; btn.textContent = "Run Feasibility Study";
      }
    });

    // Run once on load with defaults so the page isn't empty
    $("runHold").click();
  }

  function renderGate(){
    $("fs").innerHTML = '<div class="rGate"><h3>Feasibility Study is part of Scarce Plus</h3>'+
      '<p>Upgrade to Scarce Plus to run full cash-flow and ROI models — both buy-and-hold and buy-renovate-sell scenarios.</p>'+
      '<a href="auth.html?mode=signup">Get Scarce Plus</a></div>';
  }

  async function init(){
    var session = (await sb.auth.getSession()).data.session;
    if(!session){ renderGate(); return; }
    var profRes = await sb.from("profiles").select("tier").eq("id", session.user.id).single();
    if(profRes.data && profRes.data.tier === "paid"){
      renderCalculator();
    } else {
      renderGate();
    }
  }

  init();
})();
</script>
</body>
</html>
